<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>투자 도우미</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>투자 도우미</h1>
    <nav>
      <a href="reports.html">저장된 리포트</a>
      <button type="button" id="new-chat">새 대화</button>
    </nav>
  </header>
  <div id="banner" role="alert" hidden></div>
  <main>
    <ol id="log" role="log" aria-live="polite" aria-label="대화"></ol>
    <div id="status" aria-live="polite"></div>
  </main>
  <form id="form">
    <label for="msg" class="sr-only">메시지</label>
    <textarea id="msg" maxlength="2000" rows="2" required aria-describedby="help"></textarea>
    <button type="submit" id="send">전송</button>
    <p id="help">Enter 전송, Shift+Enter 줄바꿈. 새로고침하면 화면 대화 내용은 사라지지만 맥락은 서버가 기억합니다.</p>
  </form>
  <footer id="disclaimer">투자 권유가 아니며 전문가 조언을 대신하지 않습니다.</footer>
  <script src="common.js"></script>
  <script src="chat.js"></script>
</body>
</html>
