<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>투자 도우미</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>투자 도우미</h1>
    <nav>
      <a href="reports.html">저장된 리포트</a>
      <button type="button" id="new-chat">새 분석</button>
    </nav>
  </header>
  <form id="cf-form" class="search cf">
    <details id="cf" open>
      <summary>조건으로 찾기 (용어 몰라도 OK)</summary>
      <div class="cf-body">
        <label for="cf-industry">산업</label>
        <select id="cf-industry"></select>
        <p class="hint">목록에 없는 산업은 아래 채팅창에 직접 입력하세요.</p>
        <fieldset>
          <legend>조건 (여러 개 선택 가능)</legend>
          <div id="cf-chips"></div>
        </fieldset>
        <button type="submit" id="cf-go">찾기</button>
        <p id="cf-err" class="hint" role="alert" hidden></p>
      </div>
    </details>
  </form>
  <form id="form" class="search">
    <label for="msg" class="sr-only">분석할 질문</label>
    <div class="composer">
      <textarea id="msg" maxlength="2000" rows="1" required aria-describedby="help"
                placeholder="예: 반도체 중 ROE 10% 이상, PER 산업 평균 이하"></textarea>
      <button type="submit" id="send">분석</button>
    </div>
    <p id="help">Enter 분석 · Shift+Enter 줄바꿈 · 조건 칩을 누르면 변경 문장이 채워집니다 · 새로고침해도 이 탭에서는 최근 분석 10건이 유지됩니다</p>
    <div class="chips-wrap"><span id="chips-label">현재 조건</span><ul id="chips" aria-labelledby="chips-label"></ul></div>
  </form>
  <div class="layout">
    <aside id="side" aria-label="실행 상태">
      <div id="banner" role="alert" hidden></div>
      <div id="status" aria-live="polite"></div>
      <details id="side-panel" open><summary id="side-sum">실행 과정</summary><ol id="timeline" class="timeline"></ol></details>
    </aside>
    <main>
      <p id="empty" class="empty">질문을 입력하면 분석 결과가 여기에 쌓입니다.</p>
      <ol id="log" aria-label="분석 실행 기록"></ol>
    </main>
  </div>
  <footer id="disclaimer">투자 권유가 아니며 전문가 조언을 대신하지 않습니다.</footer>
  <script src="common.js"></script>
  <script src="chat.js"></script>
</body>
</html>
